<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="x-apple-disable-message-reformatting">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>{{TITLE}}</title>
	<style>
		body { margin:0; padding:0; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
		table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
		img { border:0; display:block; line-height:100%; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
		p { margin:0; padding:0; }
		@media only screen and (max-width: 599px) {
			.em_main_table { width:100% !important; }
			.em_wrapper { width:100% !important; }
			.em_full_img img { width:100% !important; height:auto !important; }
			.em_center { text-align:center !important; }
		}

	</style>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
	<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#ffffff">
		<tr>
			<td align="center" valign="top">
				<table role="presentation" width="{{WIDTH}}" border="0" cellspacing="0" cellpadding="0" class="em_main_table" style="width:{{WIDTH}}px; max-width:{{WIDTH}}px;">
				</table>
			</td>
		</tr>
	</table>
</body>
</html>

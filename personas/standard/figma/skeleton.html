<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="x-apple-disable-message-reformatting">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>{{TITLE}}</title>
	<style>
		body { margin:0; padding:0; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
		table, td { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
		img { border:0; display:block; line-height:100%; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
		p { margin:0; padding:0; }
		@media only screen and (max-width: 599px) {
			.em_main_table { width:100% !important; }
			.em_wrapper { width:100% !important; }
			.em_full_img img { width:100% !important; height:auto !important; }
			.em_center { text-align:center !important; }
		}

		:root { color-scheme: light dark; supported-color-schemes: light dark; }
		@media screen and (prefers-color-scheme: dark) {
			.em_dm_txt_white, .em_dm_txt_white a { color: #ffffff !important; }
			.em_dm_txt_black, .em_dm_txt_black a { color: #000000 !important; }
			.em_body, .em_full_wrap, .em_main_table, .em_main_tableA { background-color: #000000 !important; }
			.em_full_wrapA { background-color: #000000 !important; color: #ffffff !important; }
			.em_darkbg { background-color: #000000 !important; }
			.em_lightbg { background-color: #ffffff !important; }
			.em_dark_color { color: #000000 !important; }
			.em_light_color { color: #ffffff !important; }
		}
	</style>
</head>
<body class="em_body" style="margin:0; padding:0; background-color:#ffffff;">
	<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#ffffff" class="em_full_wrap em_darkbg">
		<tr>
			<td align="center" valign="top">
				<table role="presentation" width="{{WIDTH}}" border="0" cellspacing="0" cellpadding="0" class="em_main_table em_darkbg" style="width:{{WIDTH}}px; max-width:{{WIDTH}}px;">
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
